    <path d="M 64 45 C 72 38, 80 40, 84 36 C 86 32, 80 28, 74 32 C 68 36, 64 40, 62 44 Z" />
  </g>

  <!-- Sừng phải đối xứng -->
  <g fill="url(#antlerGrad)" filter="url(#antlerShadow)">
    <path d="M 128 94 C 132 72, 142 52, 152 32 C 154 28, 148 24, 144 28 C 136 40, 128 54, 122 70 C 118 55, 112 42, 120 22 C 122 18, 115 14, 112 18 C 104 34, 104 56, 112 84 Z" />
    <path d="M 144 50 C 156 45, 165 48, 168 42 C 170 38, 164 35, 158 38 C 152 40, 146 43, 142 46 Z" />
    <path d="M 116 45 C 108 38, 100 40, 96 36 C 94 32, 100 28, 106 32 C 112 36, 116 40, 118 44 Z" />
