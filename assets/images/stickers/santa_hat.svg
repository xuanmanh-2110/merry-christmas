<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <linearGradient id="hatRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3838" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Thân mũ đỏ uốn lượn nghiêng -->
  <path d="M 25 105 C 32 60, 68 28, 120 18 C 132 15, 142 25, 138 38 C 130 65, 135 88, 142 98 C 145 102, 142 108, 136 108 Z" 
        fill="url(#hatRed)" filter="url(#shadow)" />
  <path d="M 45 95 C 60 45, 95 30, 125 22" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.4" />
  <!-- Quả cầu bông trắng chóp mũ -->
  <circle cx="140" cy="105" r="15" fill="#f8fafc" filter="url(#shadow)" />
  <circle cx="138" cy="102" r="13" fill="#ffffff" />
  <circle cx="135" cy="99" r="6" fill="#e2e8f0" opacity="0.6" />
  <!-- Vành lông trắng xốp dưới đáy mũ -->
  <rect x="12" y="96" width="128" height="26" rx="13" fill="#f8fafc" filter="url(#shadow)" />
  <rect x="15" y="98" width="122" height="22" rx="11" fill="#ffffff" />
  <!-- Chấm bông texture -->
  <circle cx="28" cy="109" r="3.5" fill="#e2e8f0" opacity="0.6" />
  <circle cx="48" cy="107" r="4" fill="#e2e8f0" opacity="0.6" />
  <circle cx="70" cy="110" r="3.5" fill="#e2e8f0" opacity="0.6" />
  <circle cx="92" cy="108" r="4" fill="#e2e8f0" opacity="0.6" />
  <circle cx="114" cy="107" r="3.5" fill="#e2e8f0" opacity="0.6" />
</svg>
