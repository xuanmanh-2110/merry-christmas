<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 130" width="150" height="130">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="berryGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="45%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="mistletoeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Lá tầm gửi trái -->
  <path d="M 75 60 C 50 48, 25 50, 15 32 C 10 24, 25 15, 42 20 C 58 26, 68 45, 75 60 Z" 
        fill="url(#leafGrad1)" filter="url(#mistletoeShadow)" />
  <path d="M 28 26 Q 50 38 72 58" fill="none" stroke="#74c69d" stroke-width="1.8" opacity="0.6" />

  <!-- Lá tầm gửi phải -->
  <path d="M 75 60 C 100 48, 125 50, 135 32 C 140 24, 125 15, 108 20 C 92 26, 82 45, 75 60 Z" 
        fill="url(#leafGrad2)" filter="url(#mistletoeShadow)" />
  <path d="M 122 26 Q 100 38 78 58" fill="none" stroke="#74c69d" stroke-width="1.8" opacity="0.6" />

  <!-- Lá tầm gửi dưới -->
  <path d="M 75 60 C 65 85, 70 110, 85 120 C 95 125, 105 112, 100 95 C 95 80, 85 68, 75 60 Z" 
        fill="url(#leafGrad1)" filter="url(#mistletoeShadow)" />

  <!-- 3 Quả mọng đỏ tươi -->
  <circle cx="68" cy="68" r="11" fill="url(#berryGrad)" filter="url(#mistletoeShadow)" />
  <circle cx="64" cy="64" r="3" fill="#ffffff" opacity="0.8" />
  
  <circle cx="86" cy="66" r="10.5" fill="url(#berryGrad)" filter="url(#mistletoeShadow)" />
  <circle cx="82" cy="62" r="2.8" fill="#ffffff" opacity="0.8" />

  <circle cx="76" cy="50" r="11.5" fill="url(#berryGrad)" filter="url(#mistletoeShadow)" />
  <circle cx="72" cy="46" r="3.2" fill="#ffffff" opacity="0.8" />
  
  <!-- Nơ vàng thắt cuống -->
  <path d="M 75 42 C 60 30, 60 48, 72 45 Z" fill="#ffd700" />
  <path d="M 75 42 C 90 30, 90 48, 78 45 Z" fill="#ffd700" />
  <circle cx="75" cy="43" r="3" fill="#f59e0b" />
</svg>
